name: Import BIDV statements from Gmail

on:
  schedule:
    # GitHub may delay or silently drop scheduled runs (worst at the top and
    # half of the hour), so run three times a day at off-peak minutes.
    # Re-runs are cheap: already-imported attachments are skipped.
    # 23:47 / 02:17 / 05:17 UTC = 06:47 / 09:17 / 12:17 Vietnam time.
    - cron: "47 23 * * *"
    - cron: "17 2 * * *"
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "3"

# Never run two imports at once (e.g. a manual run overlapping a scheduled one).
concurrency:
  group: gmail-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Import attachments into MotherDuck
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          STATEMENT_PASSWORD: ${{ secrets.STATEMENT_PASSWORD }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MD_DATABASE: ${{ vars.MD_DATABASE || 'LiteX_PO_Data' }}
        run: |
          if [ -z "$MOTHERDUCK_TOKEN" ]; then echo "MOTHERDUCK_TOKEN secret is required"; exit 1; fi
          python -m refund_tracker.gmail_import --days "${{ github.event.inputs.days || '3' }}"
# Re-runs are cheap: already-imported attachments are skipped.
